<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kawaii Platformer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #222;
    height: 100%;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  h1 {
    margin: 10px;
    color: #ffd966;
    text-shadow: 2px 2px 0 #222;
    font-size: 22px;
    letter-spacing: 1px;
  }
  #wrap {
    border: 4px solid #222;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    background: #5dd0e3;
  }
  canvas {
    display: block;
  }
  #controls {
    margin: 8px;
    font-size: 14px;
    color: #ddd;
  }
  kbd {
    background: #444;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid #888;
    font-family: monospace;
  }
</style>
</head>
<body>
  <h1>🌸 Kawaii Platformer 🌸</h1>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="controls">
    Move: <kbd>←</kbd> <kbd>→</kbd> &nbsp;|&nbsp; Jump: <kbd>Space</kbd>/<kbd>↑</kbd> &nbsp;|&nbsp; Shoot: <kbd>F</kbd> &nbsp;|&nbsp; Restart: <kbd>R</kbd>
  </div>
  <script src="game.js"></script>
</body>
</html>
